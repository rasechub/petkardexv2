name: CI/CD - Mantenimiento PetKardex v2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Fase Build - Verificar sintaxis PHP (Lint)
        run: find src public -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Fase Test - Verificar estructura crítica y seguridad
        run: |
          test -f src/Config/database.php
          test -f src/Helpers/Security.php
          echo "Verificación de integridad superada"